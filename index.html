.term{font:500 clamp(34px,6vw,57px)/1.13 Baskervville,Georgia,serif;letter-spacing:-.025em}.term span{display:inline-block}.separator{font-size:.62em;color:#979a9f;vertical-align:middle}.m{color:var(--blue)}.f{color:var(--red)}.meaning{font-size:clamp(25px,4.5vw,38px);font-weight:650;line-height:1.4}
.gender,.ai{font-size:13px;color:var(--muted);font-weight:500}.ai{margin-inline-start:6px;white-space:nowrap}

.flip{position:absolute;inset:0;width:100%;height:100%;z-index:1;border:0;background:transparent;border-radius:inherit}.flip:hover:enabled{background:transparent}.flip-hint{text-align:center;color:var(--muted);font-size:13px}
.nav{display:grid;grid-template-columns:1fr auto 1fr}.nav button:last-child{justify-self:stretch}.audio-status{min-height:1.5em;text-align:center;margin-top:12px;color:#8b3b35;font-size:14px}
.home-actions,.dict-controls{display:flex;align-items:center;gap:10px}

.dict-controls .mode{gap:9px}.dict-count{color:var(--muted);font-size:14px}
.dict-group{margin:24px 0}.dict-group h3{font-size:18px;margin:0 0 8px}
.dict-list{border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.entry+.entry{border-top:1px solid var(--line)}
.entry-row{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) auto minmax(0,1fr) 14px;gap:12px;align-items:center;padding:9px 14px}
.entry-row::after{content:"⌄";color:var(--muted);pointer-events:none;justify-self:center}
.entry-row:has([aria-expanded="true"])::after{transform:rotate(180deg)}
.entry-toggle{background:none;border:0;padding:0;text-align:left;min-width:0}
.entry-toggle::after{content:"";position:absolute;inset:0;border-radius:6px}
.entry-toggle:focus-visible{outline:none}.entry-toggle:focus-visible::after{outline:3px solid #8174b5;outline-offset:-3px}
.entry-row .term{font-size:clamp(20px,3.8vw,27px);overflow-wrap:anywhere}.entry-row .term span{display:inline}
.entry-row .meaning{font-size:16px;font-weight:500;overflow-wrap:anywhere}

.reveal:not(.masked){border-color:transparent}
.entry .example{margin:0 14px;padding:12px 0 15px}.entry .example p{font-size:20px}
.entry .example .reveal{display:block;margin-top:6px}
#dict-audio:not(:empty){position:sticky;bottom:10px;z-index:3;margin:10px 0;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);box-shadow:0 2px 10px #34394a22}
@media(max-width:480px){.dict-controls{gap:4px}.search{flex-basis:100%}.entry-row{gap:7px;padding:8px;grid-template-columns:minmax(0,1.15fr) 44px minmax(0,1fr) 12px}.entry-row .meaning{font-size:15px}.home-actions{gap:6px}.home-actions button{padding-inline:12px}}
.mark-word{position:relative;z-index:2;min-height:44px;white-space:nowrap;font-size:14px;padding-inline:9px}
.mark-word[aria-pressed="true"]{background:#fff0c4;color:#654400;border-color:#b48c38}
.group-counts{text-align:right}.group-counts small{display:block;font-size:12px;color:var(--muted)}
.backup-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#mark-status:not(:empty){margin-top:8px;color:var(--muted);font-size:14px}
.entry-row{grid-template-columns:minmax(0,1.15fr) auto minmax(0,1fr) auto 14px}
@media(max-width:520px){
  .entry-row{grid-template-columns:minmax(0,1fr) 44px auto 12px;grid-template-areas:"term sound mark arrow" "meaning meaning meaning meaning";gap:4px 7px}
  .entry-toggle{grid-area:term}.entry-row>.sound{grid-area:sound}.entry-row>.mark-word{grid-area:mark}
  .entry-row>.meaning,.entry-row>.reveal{grid-area:meaning}.entry-row::after{grid-area:arrow}
}
[hidden]{display:none!important}
@media(max-width:600px){main{padding-top:19px}header{padding:18px 0}.deck-art{width:57px;height:43px}.groups{grid-template-columns:1fr;gap:7px}.group{padding:11px 14px}.section-head{margin-top:16px}.subtle{padding-inline:7px}.settings{margin:12px 0}.nav{gap:6px}.nav button{padding-inline:6px}.flash{margin-top:14px}.toolbar{flex-wrap:wrap}}
</style>
</head>
<body><main>
<header><div><p class="french-title" lang="fr">Carnet de vocabulaire</p><h1>法文單詞卡</h1></div><div class="deck-art" aria-hidden="true"><i></i></div></header>
<section id="home" aria-labelledby="group-title">
<div class="section-head"><div><h2 class="section-title" id="group-title">選擇分類</h2><p class="muted summary" id="total"></p></div><div class="tools"><button class="subtle" id="all">全選</button><button class="subtle" id="none">全部取消</button></div></div>
<div id="groups" class="groups"></div>
<div class="settings"><label class="mode"><input id="reverse" class="switch" type="checkbox" role="switch"><span><strong>反向模式</strong><span class="hint">先睇中文或日文，翻卡睇法文</span></span></label>
<label class="mode"><input id="only-unfamiliar" class="switch" type="checkbox" role="switch"><span><strong>只溫唔熟的字</strong><span class="hint">由已揀分類中，練習標咗星嘅單詞</span></span></label></div>
<div class="toolbar"><span id="selection" aria-live="polite" class="selection"></span><div class="home-actions"><button type="button" onclick="location.href='pronunciation.html'">發音</button><button id="open-dict">字典</button><button id="start" class="primary">開始練習 →</button></div></div>
<div class="backup-actions"><button id="export-marks">匯出標記</button><button id="import-marks" title="將備份標記合併到目前標記">匯入標記</button><input id="mark-file" type="file" accept=".txt,.json,text/plain,application/json" hidden></div>
<p id="mark-status" role="status"></p>
<p class="voice-info" id="voice-name" role="status"></p>
</section>
<section id="dictionary" aria-labelledby="dict-title" hidden>
<div class="study-head"><button id="dict-back" class="subtle">← 返回主畫面</button></div>
<h2 class="section-title" id="dict-title" tabindex="-1">字典</h2>
<div class="dict-controls"><input type="search" id="dict-search" class="search" aria-label="搜尋法文、中文或日文" placeholder="搜尋法文、中文或日文" autocomplete="off">
<label class="mode"><input type="checkbox" role="switch" id="hide-trans" class="switch"><span><strong>隱藏翻譯</strong><span class="hint">點空白格睇答案</span></span></label></div>
<p id="dict-count" class="dict-count" role="status"></p><div id="dict-groups"></div>
<p id="dict-audio" class="audio-status" role="status"></p>
</section>
<section id="study" aria-label="單詞卡練習" hidden>
<div class="study-head"><button id="back" class="subtle">← 返回主畫面</button><strong id="progress" aria-live="polite"></strong></div>
<div class="meter" aria-hidden="true"><div id="fill"></div></div>
<div class="flash"><div class="row"><strong id="category" class="card-tag"></strong><span id="side" class="side"></span></div>
<div id="content" class="content" aria-live="polite"></div><p class="flip-hint" id="flip-hint"></p><button id="flip" class="flip" aria-label="翻卡"></button></div>
<div class="nav"><button id="prev">← 上一張</button><button id="shuffle">重新洗牌</button><button id="next" class="primary">下一張 →</button></div>
<p id="audio-status" role="status" class="audio-status"></p>
</section>
</main>
<script>
"use strict";
const byId = id => document.getElementById(id);
const groups = new Map();
for (const word of WORDS) {
  if (!groups.has(word.group)) groups.set(word.group, []);
  groups.get(word.group).push(word);
}
let deck = [];
let index = 0;
let flipped = false;
const boxes = new Map();
const synth = window.speechSynthesis;
const noFrench = "此瀏覽器未有法文語音，請用 Chrome 或 Edge 打開，或在系統設定加入法文語音。";
let frenchVoice = null;
let waitingForVoices = false;
let voiceTimer;
let pendingText = "";
let activeSpeech;
function audioStatus(message) {
  byId(byId("dictionary").hidden ? "audio-status" : "dict-audio").textContent = message;
}
function refreshVoices(initial = false) {
  const available = synth && window.SpeechSynthesisUtterance ? synth.getVoices() : [];
  const french = available.filter(v => /^fr/i.test(v.lang));
  const locale = v => v.lang.toLowerCase().replace(/_/g, "-");
  frenchVoice = french.find(v => locale(v) === "fr-fr") ||
                french.find(v => locale(v) === "fr-ca") || french[0] || null;
  clearTimeout(voiceTimer);
  waitingForVoices = Boolean(initial && synth && window.SpeechSynthesisUtterance && !available.length);
  if (waitingForVoices) {
    byId("voice-name").textContent = "語音：正在載入法文語音…";
    voiceTimer = setTimeout(() => {
      waitingForVoices = false;
      byId("voice-name").textContent = "語音：" + noFrench;
      if (pendingText) audioStatus(noFrench);
      pendingText = "";
    }, 3500);
    return;
  }
  byId("voice-name").textContent = "語音：" + (frenchVoice ? frenchVoice.name : noFrench);
  if (pendingText) {
    const text = pendingText;
    pendingText = "";
    speak(text);
  } else if (frenchVoice) {
    audioStatus("");
  }
}
if (synth) synth.addEventListener("voiceschanged", () => refreshVoices());
refreshVoices(true);
function stopSpeech() {
  pendingText = "";
  activeSpeech = null;
  if (synth) synth.cancel();
  audioStatus("");
}
function speak(text) {
  stopSpeech();
  if (waitingForVoices) {
    pendingText = text;
    audioStatus("正在載入法文語音…");
    return;
  }
  if (!frenchVoice) {
    audioStatus(noFrench);
    return;
  }
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.voice = frenchVoice;
  utterance.lang = frenchVoice.lang;
  utterance.rate = 0.9;
  activeSpeech = utterance;
  utterance.onerror = () => {
    if (activeSpeech === utterance) audioStatus("暫時讀唔到，請檢查裝置嘅法文語音設定。");
  };
  synth.speak(utterance);
}
function element(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}
function soundButton(text, label) {
  const button = element("button", "sound", "🔊");
  button.setAttribute("aria-label", label);
  button.title = label;
  button.onclick = () => speak(text);
  return button;
}
function joinArticle(article, fr) {
  if (!article) return fr;
  return article + (/['’]$/.test(article) ? "" : " ") + fr;
}
function forms(word) {
  if (word.gender === "mf") {
    const pair = word.fr.split(/\s*,\s*/);
    if (pair.length === 2) {
      const articles = word.article.split(/\s*\/\s*/);
      return pair.map((fr, i) => ({
        text: joinArticle(articles[i] ?? articles[0], fr), gender: i === 0 ? "m" : "f"
      }));
    }
  }
  return [{text: joinArticle(word.article, word.fr), gender: word.gender}];
}
function frenchTerm(parts) {
  const term = element("span", "term");
  term.lang = "fr";
  parts.forEach((part, i) => {
    if (i) term.append(element("span", "separator", " / "));
    term.append(element("span", part.gender, part.text));
  });
  return term;
}
function wordAudio(parts) {
  const spoken = parts.map(part => part.text.replace(/\(([^)]+)\)$/, "")).join(". ");
  return soundButton(spoken, "朗讀法文單詞");
}
function french(word) {
  const parts = forms(word);
  const labels = {m:"陽性", f:"陰性", mf:"陽性／陰性"};
  byId("content").append(frenchTerm(parts));
  if (labels[word.gender]) byId("content").append(element("small", "gender", labels[word.gender]));
  byId("content").append(wordAudio(parts));
}
function translation(word) {
  const japanese = word.lang === "ja";
  const line = element("span", "meaning", japanese ? (word.ja || "（未填日文）") : word.zh);
  line.lang = japanese && word.ja ? "ja" : "zh-HK";
  if (!japanese && word.zh_auto) line.append(element("small", "ai", "AI 翻譯"));
  return line;
}
function maskTranslation(line, label) {
  const button = element("button", "reveal masked");
  line.hidden = true;
  button.append(line);
  button.setAttribute("aria-label", "顯示" + label);
  button.setAttribute("aria-expanded", "false");
  button.onclick = () => {
    line.hidden = !line.hidden;
    button.classList.toggle("masked", line.hidden);
    button.setAttribute("aria-expanded", String(!line.hidden));
    if (line.hidden) button.setAttribute("aria-label", "顯示" + label);
    else button.removeAttribute("aria-label");
  };
  return button;
}
function example(word, mask = false) {
  const block = element("div", "example");
  if (word.ex_fr) {
    const line = element("p", "", word.ex_fr);
    line.lang = "fr";
    line.append(soundButton(word.ex_fr, "朗讀法文例句"));
    block.append(line);
  }
  if (word.ex_zh) {
    const line = element("small", "", word.ex_zh);
    block.append(mask ? maskTranslation(line, "例句翻譯") : line);
  }
  return block;
}
function searchKey(value) {
  return value.normalize("NFKC").toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "").normalize("NFC")
    .replace(/œ/g, "oe").replace(/æ/g, "ae").replace(/[’‘ʼ]/g, "'").trim();
}
const expandedWords = new Set();
const markStorage = "french-flashcards.unfamiliar.v1";
const markKey = word => JSON.stringify([word.group, word.fr]);
const groupMarkCounts = new Map();
const markedButtons = () => document.querySelectorAll("button.mark-word");
let marks = new Set();

function parseMarks(text) {
  const data = JSON.parse(text.replace(/^\uFEFF/, ""));
  if (data?.format !== markStorage || !Array.isArray(data.words) ||
      !data.words.every(pair => Array.isArray(pair) && pair.length === 2 &&
        pair.every(value => typeof value === "string" && value.trim().length > 0))) {
    throw new Error("Invalid mark backup");
  }
  return new Set(data.words.map(pair => JSON.stringify(pair)));
}
function encodeMarks() {
  return JSON.stringify({format:markStorage, words:[...marks].sort().map(key => JSON.parse(key))}, null, 2);
}
let unsavedMarks = false;
function readMarks() {
  if (unsavedMarks) return;
  try {
    const saved = localStorage.getItem(markStorage);
    marks = saved === null ? new Set() : parseMarks(saved);
  } catch {
    byId("mark-status").textContent = "暫時讀唔到已儲存嘅標記。";
  }
}
function paintMark(button) {
  const active = marks.has(button.dataset.markKey);
  button.textContent = active ? "✓ 已標記" : "⭐ 唔熟";
  button.setAttribute("aria-pressed", String(active));
  button.title = active ? "取消唔熟標記" : "標記為唔熟";
}
function refreshMarks() {
  markedButtons().forEach(paintMark);
  syncSelection();
}
function saveMarks(message = "") {
  try {
    localStorage.setItem(markStorage, encodeMarks());
    unsavedMarks = false;
  } catch {
    unsavedMarks = true;
    message = "瀏覽器未能儲存標記，請返主畫面撳「匯出標記」備份。";
  }
  byId("mark-status").textContent = message;
  if (unsavedMarks && !byId("study").hidden) byId("audio-status").textContent = message;
  if (unsavedMarks && !byId("dictionary").hidden) byId("dict-audio").textContent = message;
  refreshMarks();
}
function markButton(word) {
  const key = markKey(word);
  const button = element("button", "mark-word");
  button.type = "button";
  button.dataset.markKey = key;
  button.setAttribute("aria-label", word.fr + " 嘅唔熟標記");
  paintMark(button);
  button.onclick = () => {
    readMarks();
    if (marks.has(key)) marks.delete(key); else marks.add(key);
    saveMarks();
  };
  return button;
}
readMarks();
window.addEventListener("storage", event => {
  if (event.key !== markStorage && event.key !== null) return;
  readMarks();
  refreshMarks();
});
byId("export-marks").onclick = () => {
  readMarks();
  const url = URL.createObjectURL(new Blob([encodeMarks() + "\n"], {type:"text/plain;charset=utf-8"}));
  const link = element("a");
  link.href = url;
  link.download = "法文單詞卡_唔熟標記.txt";
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  byId("mark-status").textContent = "已匯出 " + marks.size + " 個標記。";
};
byId("import-marks").onclick = () => byId("mark-file").click();
byId("mark-file").onchange = async event => {
  const input = event.currentTarget;
  const file = input.files[0];
  if (!file) return;
  try {
    const imported = parseMarks(await file.text());
    readMarks();
    const previous = marks.size;
    imported.forEach(key => marks.add(key));
    saveMarks("已合併備份，新增 " + (marks.size - previous) + " 個標記。");
  } catch {
    byId("mark-status").textContent = "匯入失敗。請選擇用「匯出標記」下載嘅文字檔。";
  } finally {
    input.value = "";
  }
};
function dictionaryEntry(word, mask) {
  const entry = element("div", "entry");
  const row = element("div", "entry-row");
  const parts = forms(word);
  const toggle = element("button", "entry-toggle");
  toggle.append(frenchTerm(parts));
  toggle.setAttribute("aria-expanded", "false");
  const line = translation(word);
  row.append(toggle, wordAudio(parts), mask ? maskTranslation(line, "詞義") : line, markButton(word));
  entry.append(row);
  let detail;
  function setExpanded(open) {
    if (!detail) {
      detail = example(word, mask);
      if (!detail.childElementCount) detail.textContent = "未有例句";
      detail.hidden = true;
      entry.append(detail);
    }
    detail.hidden = !open;
    toggle.setAttribute("aria-expanded", String(open));
  }
  toggle.onclick = () => {
    const open = !expandedWords.has(word);
    if (open) expandedWords.add(word); else expandedWords.delete(word);
    setExpanded(open);
  };
  if (expandedWords.has(word)) setExpanded(true);
  return entry;
}
function renderDictionary() {
  stopSpeech();
  const query = searchKey(byId("dict-search").value);
  const mask = byId("hide-trans").checked;
  const sections = document.createDocumentFragment();
  let count = 0;
  for (const [name, words] of groups) {
    if (!boxes.get(name).checked) continue;
    const list = element("div", "dict-list");
    for (const word of words) {
      if (query) {
        const fields = [word.fr, word.zh, word.ja, ...forms(word).map(part => part.text)];
        const matches = fields.some(field => {
          const key = searchKey(field);
          return key.includes(query) || key.replace(/[()]/g, "").includes(query);
        });
        if (!matches) continue;
      }
      list.append(dictionaryEntry(word, mask));
      count++;
    }
    if (list.childElementCount) {
      const section = element("section", "dict-group");
      section.append(element("h3", "", name), list);
      sections.append(section);
    }
  }
  byId("dict-groups").replaceChildren(sections);
  byId("dict-count").textContent = count ? "共 " + count + " 個詞條" : "已選分類入面搵唔到相符詞條。";
}
function showCard() {
  stopSpeech();
  const word = deck[index];
  byId("content").replaceChildren();
  const showFrench = byId("reverse").checked === flipped;
  if (showFrench) french(word); else byId("content").append(translation(word));
  if (flipped && (word.ex_fr || word.ex_zh)) byId("content").append(example(word));
  if (flipped) byId("content").append(markButton(word));
  byId("category").textContent = word.group;
  byId("side").textContent = flipped ? "背面" : "正面";
  byId("flip-hint").textContent = flipped ? "點一下翻返正面" : "點一下揭曉答案";
  byId("flip").setAttribute("aria-label", byId("flip-hint").textContent);
  byId("progress").textContent = (index + 1) + " / " + deck.length;
  byId("fill").style.width = ((index + 1) / deck.length * 100) + "%";
  byId("prev").disabled = index === 0;
  byId("next").disabled = index === deck.length - 1;
}
function shuffle() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  index = 0;
  flipped = false;
  showCard();
}
function navigate(step) {
  const target = index + step;
  if (target < 0 || target >= deck.length) return;
  index = target;
  flipped = false;
  showCard();
}
function syncSelection() {
  let selected = 0;
  let unfamiliar = 0;
  for (const [group, box] of boxes) {
    const words = groups.get(group);
    const marked = words.filter(word => marks.has(markKey(word))).length;
    groupMarkCounts.get(group).textContent = "唔熟：" + marked + " 張";
    if (box.checked) {
      selected += words.length;
      unfamiliar += marked;
    }
  }
  const onlyMarked = byId("only-unfamiliar").checked;
  const count = onlyMarked ? unfamiliar : selected;
  byId("selection").textContent = onlyMarked ? "已揀分類有 " + count + " 張唔熟卡" : "已揀 " + count + " 張";
  byId("start").disabled = !count;
  byId("open-dict").disabled = !selected;
}
for (const [name, words] of groups) {
  const label = element("label", "group");
  const box = element("input");
  box.type = "checkbox";
  box.checked = true;
  box.setAttribute("aria-label", name);
  box.onchange = syncSelection;
  boxes.set(name, box);
  const copy = element("span", "group-copy");
  copy.append(element("b", "", name));
  const preview = element("span", "preview", words.slice(0,2).map(w => forms(w)[0].text).join(" · "));
  preview.lang = "fr";
  copy.append(preview);
  const counts = element("span", "count group-counts", words.length + " 張");
  const markedCount = element("small");
  groupMarkCounts.set(name, markedCount);
  counts.append(markedCount);
  label.append(box, copy, counts);
  byId("groups").append(label);
}
function selectAll(checked) {
  boxes.forEach(box => box.checked = checked);
  syncSelection();
}
byId("only-unfamiliar").onchange = syncSelection;
byId("all").onclick = () => selectAll(true);
byId("none").onclick = () => selectAll(false);
byId("total").textContent = groups.size + " 組 · 共 " + WORDS.length + " 張";
syncSelection();
byId("start").onclick = () => {
  const onlyMarked = byId("only-unfamiliar").checked;
  deck = WORDS.filter(word => boxes.get(word.group).checked && (!onlyMarked || marks.has(markKey(word))));
  if (!deck.length) return;
  byId("home").hidden = true;
  byId("study").hidden = false;
  shuffle();
  byId("flip").focus({preventScroll:true});
  window.scrollTo(0,0);
};
byId("flip").onclick = () => { flipped = !flipped; showCard(); };
byId("shuffle").onclick = shuffle;
byId("prev").onclick = () => navigate(-1);
byId("next").onclick = () => navigate(1);
byId("open-dict").onclick = () => {
  expandedWords.clear();
  byId("dict-search").value = "";
  byId("home").hidden = true;
  byId("dictionary").hidden = false;
  renderDictionary();
  byId("dict-title").focus({preventScroll:true});
  window.scrollTo(0,0);
};
byId("dict-search").oninput = renderDictionary;
byId("hide-trans").onchange = renderDictionary;
byId("dict-back").onclick = () => {
  stopSpeech();
  byId("dictionary").hidden = true;
  byId("home").hidden = false;
  byId("open-dict").focus({preventScroll:true});
  window.scrollTo(0,0);
};
byId("back").onclick = () => {
  stopSpeech();
  byId("study").hidden = true;
  byId("home").hidden = false;
  byId("start").focus({preventScroll:true});
  window.scrollTo(0,0);
};
document.addEventListener("keydown", event => {
  if (byId("study").hidden || event.altKey || event.ctrlKey || event.metaKey) return;
  if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
    event.preventDefault();
    navigate(event.key === "ArrowLeft" ? -1 : 1);
  }
});
</script>
</body>
