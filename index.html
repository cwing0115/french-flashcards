  for (const voice of french) {
    voiceSelect.add(new Option(voice.name + " · " + voice.lang, voiceKey(voice)));

function forms(word, definite = articleSwitch.checked) {
  const {fr, gender, article} = word;
  if (!gender) return [{text:fr, gender:""}];
  const plural = article === "les";
  if (gender !== "mf") {
    const prefix = definite ? article : plural ? "des" : gender === "f" ? "une" : "un";
    return [{text:joinArticle(prefix, fr), gender}];
  }

  // 形容詞亦會有陰陽兩式，詞庫用空冠詞識別呢類詞。
  const names = fr.split(/\s*,\s*/);
  if (!article) {
    return names.map((text, i) => ({text, gender:names.length === 1 ? "mf" : i === 0 ? "m" : "f"}));
  }
  const optionalEnding = fr.match(/^(.+)\(([^()]+)\)$/);
  const masculine = optionalEnding ? optionalEnding[1] : names[0];
  const feminine = optionalEnding ? masculine + optionalEnding[2] : names[1] ?? masculine;
  const articles = definite ? article.split(/\s*\/\s*/) : plural ? ["des"] : ["un", "une"];
  const first = articles[0];
  const second = articles[1] ?? first;
  const masculineText = joinArticle(first, masculine);
  if (masculine === feminine && first === second) return [{text:masculineText, gender:"mf"}];
  return [
    {text:masculineText, display:masculine === feminine ? first : masculineText, gender:"m"},
    {text:joinArticle(second, feminine), gender:"f"}
  ];
}

        if (query) {

          const matches = fields.some(field => {

byId("prev").onclick = () => navigate(-1);
byId("next").onclick = () => navigate(1);
byId("open-dict").onclick = () => {
  expandedWords.clear();
  byId("dict-search").value = "";
  byId("home").hidden = true;
  byId("dictionary").hidden = false;
  renderDictionary();
  byId("dict-title").focus({preventScroll:true});
  window.scrollTo(0,0);
};
byId("dict-search").oninput = renderDictionary;
byId("hide-trans").onchange = renderDictionary;
byId("dict-back").onclick = () => {
  stopSpeech();
  byId("dictionary").hidden = true;
  byId("home").hidden = false;
  byId("open-dict").focus({preventScroll:true});
  window.scrollTo(0,0);
};
byId("back").onclick = () => {
  stopSpeech();
  byId("study").hidden = true;
  byId("home").hidden = false;
  byId("start").focus({preventScroll:true});
  window.scrollTo(0,0);
};
document.addEventListener("keydown", event => {
  if (byId("study").hidden || event.altKey || event.ctrlKey || event.metaKey) return;
  if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
    event.preventDefault();
    navigate(event.key === "ArrowLeft" ? -1 : 1);
  }
});
</script>
</body>
</html>
