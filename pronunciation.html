const byId = id => document.getElementById(id);
const words = new Map(DATA.words.map(word => [word.id,word]));
const player = new Audio();
let activeButton = null;
let playAttempt = 0;
let showAll = false;
const storageKey = "french-flashcards.pronunciation.learned.v1";
const symbols = new Set(DATA.phonemes.map(p => p.symbol));
let learned = new Set();
function node(tag,cls,value) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (value !== undefined) el.textContent = value;
  return el;
}
function clearPlaying() {
  activeButton?.classList.remove("playing");
  activeButton = null;
}
function stop() {
  playAttempt++;
  player.pause();
  clearPlaying();
}
player.addEventListener("ended",clearPlaying);
function play(name,button) {
  stop();
  const attempt = playAttempt;
  byId("status").textContent = "";
  player.src = "audio/" + name;
  activeButton = button;
  button.classList.add("playing");
  player.play().catch(() => {
    if (attempt !== playAttempt) return;
    clearPlaying();
    byId("status").textContent = "未能播放錄音，請再撳一次。離線使用時，請確認 audio 資料夾同頁面放埋一齊。";
  });
}
function audioButton(name,label,cls) {
  const button = node("button",cls);
  button.type = "button";
  button.setAttribute("aria-label",label);
  button.title = label;
  button.innerHTML = '<svg class="speaker" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3zM16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg>';
  button.onclick = () => play(name,button);
  return button;
}
const ipa = value => node("span","ipa","/"+value+"/");
function wordRow(ref) {
  const w = words.get(ref.id);
  const row = node("div","wordRow");
  const info = node("div","wordInfo");
  const term = node("span","word");
  term.lang = "fr";
  let at = 0;
  for (const [start,len] of ref.marks || []) {
    term.append(w.fr.slice(at,start),node("mark","",w.fr.slice(start,start+len)));
    at = start+len;
  }
  term.append(w.fr.slice(at));
  info.append(term,ipa(w.ipa),node("span","zh",w.zh));
  row.append(info,audioButton(w.audio,"聽 "+w.fr,"playBtn"));
  return row;
}
function comparison(ids,title) {
  const block = node("div","compare");
  block.append(node("h3","",title),...ids.map(id => wordRow({id})));
  return block;
}
function ruleBody(rule,heading) {
  const box = node("div",heading?"ruleBlock":"body");
  if (heading) box.append(node("h3","spelling",rule.sp+(rule.reading?"　/"+rule.reading+"/":"")));
  if (rule.when) box.append(node("p","when",rule.when));
  if (rule.tip) box.append(node("p","tip",rule.tip));
  box.append(...rule.examples.map(wordRow));
  if (rule.contrast) box.append(comparison(rule.contrast,"對照聽"));
  return box;
}
function renderAlphabet() {
  for (const l of DATA.letters) {
    const button = audioButton(l.audio,"聽字母 "+l.letter[0],"tile");
    const text = node("span","letter",l.letter);
    text.lang = "fr";
    button.append(text,ipa(l.ipa));
    byId("alphabet").append(button);
  }
}
function restore() {
  try {
    const values = JSON.parse(localStorage.getItem(storageKey) || "[]");
    if (Array.isArray(values)) learned = new Set(values.filter(v => symbols.has(v)));
  } catch { learned = new Set(); }
}
function updateProgress() {
  byId("total").textContent = "學咗 "+learned.size+" / "+DATA.phonemes.length;
  byId("progress").value = learned.size;
}
function soundCard(p) {
  const card = node("details","panel");
  const summary = node("summary");
  const line = node("span","summaryRow");
  const flag = node("span","count",learned.has(p.symbol)?"✓ 學咗":"");
  line.append(node("span","symbol","/"+p.symbol+"/"),flag);
  summary.append(line);
  const box = node("div","body");
  const actions = node("div","actionRow");
  const listen = audioButton(p.audio,"聽音素 /"+p.symbol+"/","listen");
  listen.append("聽音素");
  const label = node("label","check");
  const check = node("input");
  check.type = "checkbox";
  check.checked = learned.has(p.symbol);
  check.setAttribute("aria-label","音素 /"+p.symbol+"/ 學咗");
  check.onchange = () => {
    if (check.checked) learned.add(p.symbol); else learned.delete(p.symbol);
    flag.textContent = check.checked?"✓ 學咗":"";
    updateProgress();
    try { localStorage.setItem(storageKey,JSON.stringify([...learned])); }
    catch { byId("status").textContent = "瀏覽器未能儲存進度，今次剔選只會保留到關閉頁面。"; }
  };
  label.append(check,"學咗");
  actions.append(listen,label);
  box.append(actions);
  const matched = DATA.rules.filter(r => r.phoneme===p.symbol);
  for (const r of matched.filter(r => r.basic)) box.append(ruleBody(r,true));
  const advanced = matched.filter(r => !r.basic);
  if (advanced.length) {
    const fold = node("details","fold");
    fold.append(node("summary","","進階串法（"+advanced.length+"）"),...advanced.map(r=>ruleBody(r,true)));
    box.append(fold);
  }
  if (p.compare.length) box.append(comparison(p.compare,"清音同濁音對照"));
  card.append(summary,box);
  return card;
}
function renderSounds() {
  for (const group of ["元音","半元音","子音"]) {
    const section = node("section","soundGroup");
    const list = DATA.phonemes.filter(p => p.group===group);
    section.append(node("h2","",group+"（"+list.length+"）"),...list.map(soundCard));
    byId("soundGroups").append(section);
  }
  updateProgress();
}
const normalize = value => value.normalize("NFC").toLowerCase().replace(/\s+/g,"").replaceAll("œ","oe");
function renderRules() {
  const query = normalize(byId("search").value.trim());
  const matches = DATA.rules.filter(r => (showAll||r.basic) && normalize(r.sp+" "+r.when).includes(query));
  byId("ruleCount").textContent = matches.length+" 條規則";
  const list = byId("ruleList");
  list.replaceChildren();
  for (const r of matches) {
    const card = node("details","ruleCard");
    const summary = node("summary");
    const line = node("span","summaryRow");
    line.append(node("span","spelling",r.sp+(r.reading?"　/"+r.reading+"/":"")),node("span","level",r.basic?"基本":"進階"));
    summary.append(line);
    card.append(summary,ruleBody(r,false));
    list.append(card);
  }
  if (!matches.length) list.append(node("p","empty",showAll?"搵唔到相符串法。":"搵唔到相符嘅基本規則，可以撳「顯示全部」再搵。"));
}
function setFilter(all) {
  showAll = all;
  byId("basic").setAttribute("aria-pressed",String(!all));
  byId("allRules").setAttribute("aria-pressed",String(all));
  renderRules();
}
const tabs = [...document.querySelectorAll('[role="tab"]')];
function activate(tab) {
  stop();
  for (const item of tabs) {
    const selected = item===tab;
    item.setAttribute("aria-selected",String(selected));
    item.tabIndex = selected?0:-1;
    byId(item.getAttribute("aria-controls")).hidden = !selected;
  }
}
tabs.forEach((tab,i) => {
  tab.onclick = () => activate(tab);
  tab.onkeydown = event => {
    const choices = {ArrowLeft:(i+2)%3,ArrowRight:(i+1)%3,Home:0,End:2};
    if (!(event.key in choices)) return;
    event.preventDefault();
    const next = tabs[choices[event.key]];
    next.focus();activate(next);
  };
});
byId("basic").onclick = () => setFilter(false);
byId("allRules").onclick = () => setFilter(true);
byId("search").oninput = renderRules;
restore();
renderAlphabet();
renderSounds();
renderRules();
</script>
</body></html>
